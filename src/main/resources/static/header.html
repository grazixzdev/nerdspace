<div class="btns">
  <input
    id="main-search"
    class="search-input"
    type="text"
    placeholder="Pesquisar"
  />

  <button class="btn-icon" id="btn-search">
    <img src="./img/icon_search.png" alt="pesquisar" width="40px" />
  </button>

  <button class="btn-icon">
    <img src="./img/icon_filter.png" alt="filtrar" width="40px" />
  </button>
</div>

<div id="modal-filtro" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <h3>Filtrar Conteúdo</h3>

    <div class="filter-group">
      <label>Ano de Lançamento</label>
      <input
        type="number"
        id="filter-year"
        min="1950"
        max="2026"
        placeholder="Ex: 2025"
        class="search-input"
        style="width: 100%"
      />
    </div>

    <div class="filter-group">
      <label>Avaliação Mínima (Rating)</label>
      <input
        type="range"
        id="filter-rating"
        min="0"
        max="9.5"
        step="0.5"
        value="0"
      />
      <span id="rating-value">0</span>
    </div>
    <button id="apply-filters" class="btn-more">Aplicar Filtros</button>
  </div>
</div>
