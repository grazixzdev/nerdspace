<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>NerdSpace</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="./img/nerd.png" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <header class="cabecalho"></header>

      <main class="meio">
        <div class="destaques" id="lista-populares">
          <h2 class="title-destaques">Populares</h2>
          <div id="lista-populares-grid" class="grid-midias"></div>
        </div>
      </main>

      <footer class="rodape"></footer>
    </div>

    <script src="./js/script.js"></script>
    <script>
      /**
       * =========================================================
       * CONFIGURAÇÃO
       * =========================================================
       * Centraliza valores que podem mudar sem mexer na lógica.
       */
      const CONFIG = Object.freeze({
        API_BASE_URL: "http://localhost:8080",
        FALLBACK_IMAGE: "https://via.placeholder.com/200x300?text=Sem+Capa",
      });

      /**
       * Normaliza a resposta da API para suportar lista pura ou paginação.
       *
       * @param {unknown} data
       * @returns {Array<Object>}
       */
      function extractMediaList(data) {
        if (Array.isArray(data)) return data;
        if (Array.isArray(data?.content)) return data.content;
        return [];
      }

      /**
       * Cria a imagem clicável da mídia.
       *
       * Motivo:
       * Mantém a montagem do card isolada para facilitar reutilização.
       *
       * @param {Object} item
       * @returns {HTMLImageElement}
       */
      function createMediaImage(item) {
        const img = document.createElement("img");

        img.src = item.image;
        img.alt = item.translatedTitle || item.title || "Mídia";
        img.loading = "lazy";
        img.className = "img-media";

        img.addEventListener("click", () => {
          const type = (item.type || "").toLowerCase();
          window.location.href = `infoMedia.html?id=${item.id}&type=${type}`;
        });

        img.addEventListener("error", () => {
          img.src = CONFIG.FALLBACK_IMAGE;
        });

        return img;
      }

      /**
       * Busca e renderiza a lista de populares.
       *
       * Decisão:
       * Separar busca e renderização reduz acoplamento e simplifica manutenção.
       */
      async function carregarPopulares() {
        const grid = document.getElementById("lista-populares-grid");

        if (!grid) return;

        grid.innerHTML = "<p>Carregando...</p>";

        try {
          const response = await fetch(
            `${CONFIG.API_BASE_URL}/media/lista-populares?size=100`,
          );

          if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
          }

          const data = await response.json();
          const lista = extractMediaList(data);

          grid.innerHTML = "";

          if (lista.length === 0) {
            grid.innerHTML = "<p>Nenhum item encontrado.</p>";
            return;
          }

          lista.forEach((item) => {
            grid.appendChild(createMediaImage(item));
          });
        } catch (error) {
          console.error("Erro ao carregar populares:", error);
          grid.innerHTML = "<p>Erro ao carregar os itens.</p>";
        }
      }

      /**
       * Inicializa a página quando o DOM estiver pronto.
       */
      document.addEventListener("DOMContentLoaded", () => {
        carregarPopulares();
      });
    </script>
  </body>
</html>
